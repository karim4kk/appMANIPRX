<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIMSP - جاري التحميل</title>
  
  <!-- تحويل فوراً خلال 0 ثانية إلى رابط موقعك -->
  <meta http-equiv="refresh" content="0; url=https://sites.google.com/view/mimsp/">
  
  <script>
    // توجيه برمجي سريع جداً لضمان تحويل تلقائي فور فتح التطبيق
    window.location.replace("https://sites.google.com/view/mimsp/");
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      text-align: center;
    }
    .loader-container {
      padding: 20px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 15px auto;
      border: 4px solid #e9ecef;
      border-top: 4px solid #0d6efd;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    p {
      font-size: 16px;
      margin: 0;
    }
    a {
      color: #0d6efd;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="loader-container">
    <div class="spinner"></div>
    <p>جاري فتح منصة MIMSP...</p>
    <p style="margin-top: 10px; font-size: 13px; color: #6c757d;">
      إذا لم يتم التحويل تلقائياً، <a href="https://sites.google.com/view/mimsp/">اضغط هنا</a>.
    </p>
  </div>

</body>
</html>
